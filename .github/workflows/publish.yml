name: Publish to npm

# Publishing a GitHub release whose tag is v<version> publishes that version
# to npm. Authentication is npm trusted publishing: the job presents GitHub's
# OIDC identity and npm issues a short-lived token for this run only. No npm
# token is stored in the repository. The published package carries a
# provenance attestation pointing back at this commit and this run.
#
# First-time setup, once, on npmjs.com under the package's settings:
# Trusted Publishing -> GitHub Actions -> owner RohanAdwankar, repository
# semfont, workflow publish.yml. npm only lets that be configured on a
# package that already exists, so the very first version goes up by hand
# with `npm publish --access public`, and every version after that is a
# release here.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or later; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm test

      - run: npm publish --provenance --access public
