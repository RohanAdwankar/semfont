name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack --dry-run

  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y fonts-liberation
      # fontbakery's googlefonts extra, spelled out. Without these it quietly runs
      # about two thirds of the profile, which is how missing glyphs once got past.
      - run: >
          pip install fonttools brotli uharfbuzz fontbakery lxml unicodedata2
          'protobuf>=3.7,<4' stringbrewer collidoscope axisregistry gflanguages
          gfsubsets glyphsets shaperglot beautifulsoup4
      - run: python -m unittest discover -s gramfont/tests
      - run: >
          python gramfont/google-fonts/prepare.py
          --repo-url https://github.com/${{ github.repository }}
          --base /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
